# 릴리스 PR(`pnpm release` 가 만든다)이 main 에 머지되면 태그와 GitHub Release 를 만든다.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # squash 커밋 제목: "chore(release): v1.2.3 릴리스 (#45)"
    # 문자열 안의 ": " 때문에 YAML 이 키로 읽지 않도록 통째로 따옴표로 감싼다
    if: "startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 태그 · GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag 가 이미 있다"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          node scripts/release/notes.mjs "$version" > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
