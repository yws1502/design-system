# PR 검사. squash merge 라 PR 제목이 그대로 main 의 커밋 메시지가 된다.
# 로컬 husky 훅은 GitHub 에서 만든 커밋을 거치지 않으므로 여기서 같은 규칙으로 검사한다.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # commitlint.config.mjs 하나로 로컬 커밋과 PR 제목을 함께 검사한다
      - name: commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  # 제목과 상관없이 코드가 컴파일되는지. 빌드가 통과해도 동작을 보장하지는 않는다(AGENTS.md) —
  # UI 변경은 여전히 브라우저에서 확인한다.
  code:
    name: Typecheck & build
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  label:
    name: Version label
    needs: title
    # 제목이 바뀔 때만 다시 붙인다. 손으로 바꾼 라벨을 커밋 push 마다 덮어쓰지 않는다.
    # Dependabot PR 은 토큰이 읽기 전용이라 라벨을 못 붙인다 — dependabot.yml 이 직접 붙인다.
    if: github.actor != 'dependabot[bot]' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.changes.title)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: apply
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          label=$(node scripts/release/label.mjs "$PR_TITLE")
          stale=$(gh pr view "$PR" --json labels --jq \
            "[.labels[].name | select(. == \"major\" or . == \"minor\" or . == \"patch\" or . == \"no-release\") | select(. != \"$label\")] | join(\",\")")
          if [ -n "$stale" ]; then
            gh pr edit "$PR" --add-label "$label" --remove-label "$stale"
          else
            gh pr edit "$PR" --add-label "$label"
          fi
          echo "label: $label" >> "$GITHUB_STEP_SUMMARY"

  impact:
    name: Consumer impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 릴리스 노트는 PR 제목 목록뿐이다. 소비하는 쪽이 할 일은 노트의 PR 링크를 따라와 본문에서 읽는다.
      - name: 본문 "해야 할 일"이 채워졌는지
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/release/check-impact.mjs
